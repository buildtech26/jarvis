<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Jarvis</title>
  <link rel="icon" href="/icona.png">
  <!-- installabile come app: "Aggiungi a schermata Home" sul telefono, "Installa" in Chrome/Edge sul PC -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icona-180.png">
  <meta name="theme-color" content="#15181d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/stile.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <img src="/icona.png" alt="Jarvis" class="logo">
    <button id="esci" class="secondario" hidden>Esci</button>
  </header>

  <main id="accesso" hidden>
    <form id="modulo-accesso">
      <p class="tenue">Pagina privata. Su un PC non tuo, alla fine premi Esci.</p>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Entra</button>
      <p id="errore-accesso" class="errore" role="alert"></p>
    </form>
  </main>

  <main id="chat" hidden>
    <div id="messaggi" aria-live="polite"></div>
    <p id="fase" class="tenue"></p>
    <form id="modulo-chat">
      <textarea id="testo" rows="1" aria-label="Messaggio" required></textarea>
      <button type="submit" id="invia" aria-label="Invia">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
          <path d="M7.4 7.2 17.5 12 7.4 16.8 9.4 12z" fill="currentColor"/>
        </svg>
      </button>
    </form>
  </main>
</body>
</html>
